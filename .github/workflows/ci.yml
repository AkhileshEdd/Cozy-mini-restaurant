name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Asset generators still run
        run: |
          python3 tools/asset_forge/build.py > /dev/null
          python3 tools/sfx_forge.py > /dev/null

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Play a full day
        run: timeout 600 ./godot --headless --path . res://tests/smoke_test.tscn

  web:
    name: Web build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/version.txt templates/web_nothreads_release.zip -d "$dest"

      - name: Export
        run: |
          ./godot --headless --path . --import
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          cp docs/store/privacy-policy.html build/web/privacy.html

      - uses: actions/upload-artifact@v4
        with:
          name: cozy-mini-restaurant-web
          path: build/web

      - name: Package for GitHub Pages
        if: github.ref_name == github.event.repository.default_branch && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Deploy to GitHub Pages
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the CozyServices plugin (ads, consent, billing)
        working-directory: android_plugin
        run: ./gradlew --no-daemon copyAarToAddon

      - name: Install Godot and Android export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/version.txt templates/android_source.zip -d "$dest"

      - name: Point the editor at the Android SDK
        run: |
          ./godot --headless --path . --import
          settings=$(ls "$HOME"/.config/godot/editor_settings-*.tres | head -n 1)
          sed -i '/^export\/android\/android_sdk_path/d; /^export\/android\/java_sdk_path/d' "$settings"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" >> "$settings"

      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK (Gradle build with the plugin)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          ./godot --headless --path . --install-android-build-template --export-debug "Android" build/android/CozyMiniRestaurant-debug.apk
          test -f build/android/CozyMiniRestaurant-debug.apk

      - name: Check the plugin made it into the APK
        run: |
          apk=build/android/CozyMiniRestaurant-debug.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'org.godotengine.plugin.v2.CozyServices' manifest.txt
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' manifest.txt
          grep -q 'com.android.vending.BILLING' manifest.txt
          grep 'android:allowBackup' manifest.txt | grep -qE '=true|0xffffffff'
          grep -q 'android:dataExtractionRules' manifest.txt
          unzip -p "$apk" 'classes*.dex' | grep -a -q 'com/cozyminirestaurant/services/CozyServicesPlugin'
          grep -E 'targetSdkVersion|minSdkVersion' manifest.txt
          echo "CozyServices plugin, AdMob app id, billing permission and cloud backup are in the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: cozy-mini-restaurant-android-debug
          path: build/android/*.apk

      # Signed bundle for Google Play, built when the repository has the
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_ALIAS / ANDROID_KEYSTORE_PASSWORD
      # secrets (see README).
      - name: Play Store bundle needs the upload key
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::notice::No ANDROID_KEYSTORE_* secrets, so no .aab this run. See docs/store/RELEASE.md."

      - name: Export Play Store bundle (AAB)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          ./godot --headless --path . --export-release "Android Play Store" build/android/CozyMiniRestaurant.aab
          test -f build/android/CozyMiniRestaurant.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: cozy-mini-restaurant-play-bundle
          path: build/android/*.aab
